<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Retro Green Grid Background</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");

            body {
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: black;
                font-family: "Press Start 2P", cursive;
                overflow: hidden;
            }

            .grid-background {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
                background-color: black;
                background-image: repeating-linear-gradient(
                        90deg,
                        transparent,
                        transparent 49px,
                        #00ff00 50px
                    ),
                    repeating-linear-gradient(
                        0deg,
                        transparent,
                        transparent 49px,
                        #00ff00 50px
                    );
                background-size: 100px 100px;
                opacity: 0.7;
                animation: moveGrid 300s linear infinite;
            }

            .container {
                position: relative;
                text-align: center;
                z-index: 1; /* Content will stay on top of the grid */
            }

            h1 {
                color: #ffffff;
                font-size: 2.5em;
                margin-bottom: 20px;
            }
            h3 {
                color: #ffffff;
                font-size: 1.5em;
                margin-bottom: 20px;
            }

            img {
                width: 100px;
                height: auto;
                border: 3px solid #00ff00;
                background: #000000;
                border-radius: 10px;
            }

            @keyframes moveGrid {
                from {
                    background-position: 0 0;
                }
                to {
                    background-position: 100px 100px;
                }
            }
        </style>
    </head>
    <body>
        <div class="grid-background"></div>
        <div class="container">
            <h1><a href="https://u.latebit.io">U</a></h1>
            <br />
            <h1>LATEBIT.IO</h1>
            <img src="latebitflip.png" alt="latebitflip" />
            <h3>@ontehfritz</h3>
            <img src="fritz-pixel.png" alt="ontehfritz" />
        </div>
    </body>
</html>
